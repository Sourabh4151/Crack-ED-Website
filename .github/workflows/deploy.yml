name: Deploy Crack-ED Website

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e

            PROJECT_DIR="/srv/sites/Crack-ED-Website"

            echo "======================================"
            echo "Starting Crack-ED deployment"
            echo "======================================"

            cd "$PROJECT_DIR"

            echo "Checking current branch..."
            git checkout main

            echo "Fetching latest code..."
            git fetch origin main

            echo "Updating source code..."
            git pull --ff-only origin main

            echo "======================================"
            echo "Building frontend"
            echo "======================================"

            cd "$PROJECT_DIR/frontend"

            npm ci
            npm run build

            echo "Frontend build completed."

            echo "======================================"
            echo "Updating backend"
            echo "======================================"

            cd "$PROJECT_DIR/backend"

            source venv/bin/activate

            pip install -r requirements.txt

            echo "Running migrations..."
            python manage.py migrate --noinput

            echo "Collecting static files..."
            python manage.py collectstatic --noinput

            echo "======================================"
            echo "Restarting backend"
            echo "======================================"

            sudo systemctl restart crack-ed-backend

            echo "Waiting for backend..."
            sleep 5

            echo "Checking backend service..."
            sudo systemctl is-active --quiet crack-ed-backend

            echo "Checking port 9001..."
            ss -lnt | grep -q ':9001'

            echo "======================================"
            echo "Deployment successful"
            echo "======================================"