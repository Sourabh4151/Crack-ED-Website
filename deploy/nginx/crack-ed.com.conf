# Crack-ED frontend routing.
#
# Paste this into the existing crack-ed.com server, or replace that server block
# with this file. Keep the live listen, ssl_certificate, ssl_certificate_key,
# and the HTTP → HTTPS server that Certbot already installed. This file does
# not define those lines, so copying it over a Certbot file without putting
# the SSL lines back will break HTTPS.
#
# The map below must stay in the http context (it is valid at the top of a
# sites-enabled file that is included from http {}).

map $uri $frontend_index {
    default /__spa_miss__;

    /               /index.html;
    /about          /index.html;
    /programs       /index.html;
    /careers        /index.html;
    /badhta-india-dekho /index.html;
    /resources      /index.html;
    /influencer     /index.html;
    /refund-policy  /index.html;
    /privacy-policy /index.html;
    /terms-conditions /index.html;
    /contact-us     /index.html;
    /testimonials   /index.html;

    ~^/marketing/blogs$                         /index.html;
    ~^/marketing/blogs/new$                     /index.html;
    ~^/marketing/blogs/edit/[^/]+$              /index.html;
    ~^/marketing/quiz$                          /index.html;
    ~^/marketing/quiz/questions/new$            /index.html;
    ~^/marketing/quiz/questions/edit/[^/]+$     /index.html;
    ~^/marketing/quiz/programs/new$             /index.html;
    ~^/marketing/quiz/programs/edit/[^/]+$      /index.html;
    ~^/marketing/testimonials$                  /index.html;
    ~^/marketing/brochures$                     /index.html;
    ~^/marketing/testimonials/new$              /index.html;
    ~^/marketing/testimonials/edit/[^/]+$       /index.html;
}

server {
    # KEEP the existing listen / ssl_certificate / ssl_certificate_key lines here.
    server_name crack-ed.com www.crack-ed.com;

    root /srv/sites/Crack-ED-Website/frontend/dist;
    index index.html;

    error_page 404 /404.html;

    location = /404.html {
        internal;
        add_header Content-Security-Policy "frame-ancestors 'self' https://crack-ed.com" always;
    }

    location ^~ /api/ {
        client_max_body_size 25m;
        proxy_pass http://127.0.0.1:9001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /admin/ {
        proxy_pass http://127.0.0.1:9001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Content-Security-Policy "frame-ancestors 'self' https://crack-ed.com" always;
    }

    location /static/ {
        alias /srv/sites/Crack-ED-Website/backend/staticfiles/;
        expires 30d;
    }

    location /media/ {
        alias /srv/sites/Crack-ED-Website/backend/media/;
        expires 30d;
    }

    location /downloads/ {
        alias /srv/sites/downloads/;
        autoindex on;
        expires 30d;
    }

    # Slashless canonical URLs. ^~ locations above are excluded by Nginx's
    # match order; the lookahead also skips them if this regex is considered.
    location ~ ^/(?!api/|admin/|assets/|static/|media/|downloads/).+/$ {
        rewrite ^(.+)/$ $1 permanent;
    }

    # Real published blogs and legacy static post ids only.
    location ~ ^/resources/blog/[^/]+$ {
        set $original_uri $uri;
        auth_request /_internal/frontend-route;
        error_page 401 =404 /404.html;
        error_page 500 502 503 504 = @frontend_app;
        add_header Content-Security-Policy "frame-ancestors 'self' https://crack-ed.com" always;
        try_files /index.html =404;
    }

    # Real published job listings only.
    location ~ ^/careers/job/[0-9]{1,12}$ {
        set $original_uri $uri;
        auth_request /_internal/frontend-route;
        error_page 401 =404 /404.html;
        error_page 500 502 503 504 = @frontend_app;
        add_header Content-Security-Policy "frame-ancestors 'self' https://crack-ed.com" always;
        try_files /index.html =404;
    }

    location = /_internal/frontend-route {
        internal;
        proxy_pass http://127.0.0.1:9001/api/frontend-route/;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $original_uri;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ @frontend_app;
        add_header Content-Security-Policy "frame-ancestors 'self' https://crack-ed.com" always;
    }

    location @frontend_app {
        add_header Content-Security-Policy "frame-ancestors 'self' https://crack-ed.com" always;
        try_files $frontend_index =404;
    }
}
