    <script>
      (function () {
        var SITE = 'https://crack-ed.com';
        var path = location.pathname || '/';
        if (path.length > 1) path = path.replace(/\/+$/, '') || '/';
        if (!/^\/[A-Za-z0-9/_-]*$/.test(path)) path = '/';
        var indexable = {
          '/': 1,
          '/about': 1,
          '/programs': 1,
          '/careers': 1,
          '/badhta-india-dekho': 1,
          '/resources': 1,
          '/influencer': 1,
          '/refund-policy': 1,
          '/privacy-policy': 1,

          '/testimonials': 1
        };
        var dynamic = /^\/resources\/blog\/[^/]+$/.test(path) || /^\/careers\/job\/[0-9]{1,12}$/.test(path);
        var marketing = path === '/marketing' || path.indexOf('/marketing/') === 0;
        var unknown = !indexable[path] && !dynamic && !marketing;
        var url = path === '/' ? SITE + '/' : SITE + path;
        var robotsContent = marketing ? 'noindex, nofollow' : unknown ? 'noindex, follow' : 'index, follow';
        function escAttr(value) {
          return String(value).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');
        }
        document.write('<link rel="canonical" href="' + escAttr(url) + '">');
        document.write('<meta property="og:url" content="' + escAttr(url) + '">');
        var robots = document.querySelector('meta[name="robots"]');
        if (robots) robots.setAttribute('content', robotsContent);
        if (!unknown) return;
        var title = 'Page not found | CRACK-ED';
        var description = 'This page does not exist on Crack-ED. Browse programs, blogs, and careers from the homepage.';
        document.title = title;
        var desc = document.querySelector('meta[name="description"]');
        if (desc) desc.setAttribute('content', description);
        var ogTitle = document.querySelector('meta[property="og:title"]');
        if (ogTitle) ogTitle.setAttribute('content', title);
        var ogDesc = document.querySelector('meta[property="og:description"]');
        if (ogDesc) ogDesc.setAttribute('content', description);
        var twTitle = document.querySelector('meta[name="twitter:title"]');
        if (twTitle) twTitle.setAttribute('content', title);
        var twDesc = document.querySelector('meta[name="twitter:description"]');
        if (twDesc) twDesc.setAttribute('content', description);
        document.querySelectorAll('script[data-seo-jsonld]').forEach(function (node) {
